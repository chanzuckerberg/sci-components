name: Code Connect

# Validate Figma Code Connect mappings on every PR (and pushes to main).
# Fails if any .figma.tsx file is invalid or has drifted from its Figma
# component (e.g. references a renamed/removed property or node).
on:
  push:
    branches:
      - main
  pull_request:
    branches: "*"

jobs:
  code-connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Validate Code Connect
        run: npx figma connect publish --dry-run
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
