name: "Storybook Tests"

# Triggers on push to all branches, excluding the 'prod' branch
on:
  push:
    branches-ignore:
      - prod # Exclude the 'prod' branch from triggering this workflow

# One run per branch. A push supersedes the run before it, and without this the
# older run keeps a runner for up to the hour its timeout allows, so pushes queue
# behind work whose result nobody is waiting for.
concurrency:
  group: storybook-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Use the latest version of the Ubuntu runner environment

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Step 2: Set up Node.js environment and cache Yarn dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version" # Specify the Node.js version from '.node-version' file
          cache: "yarn" # Cache Yarn dependencies for faster builds

      # Step 3: Install project dependencies using Yarn
      - name: Install dependencies
        run: yarn

      # Step 4: Install Playwright for testing.
      #
      # Chromium only, on purpose. It is the one browser the suite runs in, the
      # single instance the Vitest addon is configured with. Naming no browser
      # installs the system libraries for Firefox and WebKit as well, which is
      # around 190 apt packages including gstreamer, the CJK fonts and a speech
      # synthesiser. That apt step has taken 37 minutes when the Ubuntu mirror
      # is slow, against about one minute when it is not, and it is the whole of
      # this job's variance.
      - name: Install Playwright
        run: yarn playwright install --with-deps chromium

      # Step 5: Render every story and check it for accessibility violations.
      #
      # No Storybook build, and nothing to serve: the Vitest addon loads the
      # stories through Vite from source, the same way `yarn start` does. The
      # script generates the documentation snapshot stories first, since those
      # are gitignored and so absent from a fresh checkout.
      - name: Run Storybook tests
        run: yarn test:storybook
